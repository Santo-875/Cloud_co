# Cloud Copilot Reference Source Manifest
# All sources are fetched offline; raw files are stored under data/raw/ (git-ignored).
# Never commit raw fetched content. Only this manifest and THIRD_PARTY_NOTICES.md are committed.
#
# Field definitions:
#   id              : unique snake_case identifier
#   type            : cli_guide | cli_reference | terraform_provider | pricing_concept |
#                     price_data | security_check
#   url_or_repo     : canonical URL or "owner/repo" for GitHub sources
#   pinned_version  : release tag, commit SHA, or YYYY-MM-DD fetch date
#   license_note    : short description; raw data never redistributed
#   parser          : which parser module handles this source
#   refresh_command : command to re-fetch (run from repo root with venv active)

sources:

